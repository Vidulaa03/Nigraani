global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: nigraani-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: nigraani-analyzer
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8001"]
